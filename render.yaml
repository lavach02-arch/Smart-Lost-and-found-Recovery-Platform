# Render Blueprint Infrastructure Specification
# SmartFind - Smart Lost & Found Recovery Platform

services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Express.js API + MongoDB Atlas)
  # ----------------------------------------------------
  - type: web
    name: smartfind-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://lakshmi_db_user:<password>@cluster0.qwmnfyg.mongodb.net/smartfind?retryWrites=true&w=majority
      - key: CLIENT_URL
        value: https://smartfind-frontend.onrender.com

  # ----------------------------------------------------
  # 2. Frontend Static Site (React.js + Tailwind CSS)
  # ----------------------------------------------------
  - type: static
    name: smartfind-frontend
    rootDir: frontend
    buildCommand: npm install && node node_modules/vite/bin/vite.js build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smart-lost-and-found-recovery-platfofrm.onrender.com/api
